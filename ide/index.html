<!DOCTYPE html>

<html>

<head>

<meta charset="UTF-8">
<link rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.css">
<title>✹ SpellScript</title>

<style>
*{box-sizing:border-box;}
body{
  margin:0;
  height:100vh;
  font-family:"Segoe UI",Arial,sans-serif;
  background:#fff;
  color:#1f1f1f;
  overflow:hidden;
}

/* login */
#loginScreen{
  height:100vh;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  background:#fff;
}
#loginScreen h1{font-size:32px;margin:0 0 5px;}
#loginScreen > p{color:#666;margin-bottom:25px;}

.login-box{
  width:360px;
  padding:25px;
  border:1px solid #d6d6d6;
  border-radius:6px;
  background:#fafafa;
}
.cm-keyword {
    color: #AF00DB;
    font-weight: 600;
}

.cm-string {
    color: #A31515;
}

.cm-number {
    color: #098658;
}

.cm-operator {
    color: #444444;
}
.login-box h2{font-size:16px;margin-bottom:10px;}
.login-box input{
  width:100%;
  padding:9px;
  margin-bottom:10px;
  border:1px solid #c8c8c8;
  border-radius:4px;
}
.login-box button{
  width:100%;
  padding:9px;
  border:1px solid #107c10;
  background:#107c10;
  color:#fff;
  border-radius:4px;
  cursor:pointer;
}
.CodeMirror {
height: 100%;
font-family: "Cascadia Code", Consolas, monospace;
font-size: 15px;
}
.login-box button:hover{background:#0b650b;}
.login-box hr{
  border:none;
  border-top:1px solid #ddd;
  margin:25px 0;
}
#message{margin-top:15px;font-size:13px;}

/* top */
.topbar{
  height:52px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 18px;
  background:#f3f3f3;
  border-bottom:1px solid #d6d6d6;
}
.brand{
  display:flex;
  align-items:center;
  gap:9px;
  font-size:17px;
  font-weight:600;
}
.logo{color:#6f42c1;font-size:22px;}
.top-actions{display:flex;gap:8px;}
.top-actions button{
  border:1px solid #c8c8c8;
  background:#fff;
  padding:6px 13px;
  border-radius:4px;
  font-size:13px;
  cursor:pointer;
}
.top-actions button:hover{background:#e8e8e8;}
#runButton{
  background:#107c10;
  color:#fff;
  border-color:#107c10;
}
#runButton:hover{background:#0b650b;}

/* main layout */
.workspace{
  display:flex;
  height:calc(100vh - 52px);
}

/* sidebar */
.sidebar{
  width:210px;
  background:#f7f7f7;
  border-right:1px solid #d6d6d6;
}
.sidebar-title{
  padding:14px 16px;
  font-size:11px;
  font-weight:600;
  color:#666;
  letter-spacing:.5px;
}
.file{
  padding:9px 16px;
  font-size:13px;
  cursor:pointer;
}
.file:hover{background:#e8e8e8;}

/* editor */
.editor-area{
  flex:1;
  display:flex;
  flex-direction:column;
  min-width:0;
}
.tab{
  height:38px;
  display:flex;
  align-items:center;
  padding:0 18px;
  background:#fff;
  border-bottom:1px solid #d6d6d6;
  font-size:13px;
  color:#444;
}
#editor {
    flex: 1;
    height: 100%;
    overflow: auto;
}

.output-area{
  width:330px;
  background:#fafafa;
  border-left:1px solid #d6d6d6;
}
.output-title{
  height:38px;
  display:flex;
  align-items:center;
  padding:0 15px;
  border-bottom:1px solid #d6d6d6;
  font-size:11px;
  font-weight:600;
  color:#666;
  letter-spacing:.5px;
}
#output{
  margin:0;
  padding:16px;
  font-family:"Cascadia Code",Consolas,monospace;
  font-size:13px;
  line-height:1.5;
  color:#333;
  white-space:pre-wrap;
  overflow-y:auto;
}
</style>
</head>


<body>

    <!-- LOGIN SCREEN -->

    <div id="loginScreen">

        <h1>✹ SpellScript</h1>

        <p>Welcome to the Magical World of Programming</p>


        <div class="login-box">

            <h2>Existing Wizard</h2>

            <input
                type="text"
                id="loginName"
                placeholder="Wizard name"
            >

            <button onclick="loginWizard()">
                Enter SpellScript
            </button>


            <hr>


            <h2>New Wizard</h2>

            <input
                type="text"
                id="registerName"
                placeholder="Wizard name"
            >

            <input
                type="number"
                id="registerAge"
                placeholder="Age"
            >

            <button onclick="registerWizard()">
                Register Wizard
            </button>


            <p id="message"></p>

        </div>

    </div>


    <!-- IDE -->

    <div id="ideScreen" style="display: none;">

        <header class="topbar">

            <div class="brand">

                <span class="logo">✹</span>

                <span>SpellScript</span>

            </div>


            <div class="top-actions">

                <button id="runButton" onclick="runSpell()">
                    ▶ Run
                </button>

                <button>
                    Save
                </button>

            </div>

        </header>


        <main class="workspace">


            <aside class="sidebar">

                <div class="sidebar-title">
                    EXPLORER
                </div>

                <div class="file">
                    📜 spellbook.spell
                </div>

            </aside>


            <section class="editor-area">

                <div class="tab">
                    spellbook.spell
                </div>

                <div id="editor"></div>

            </section>


            <aside class="output-area">

                <div class="output-title">
                    OUTPUT
                </div>

                <pre id="output">Run your SpellScript program to see the output here.</pre>

            </aside>


        </main>

    </div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.js"></script>
<script>


function loginWizard() {

    let name = document.getElementById("loginName").value;


    fetch("./login", {

        method: "POST",

        headers: {
            "Content-Type": "application/x-www-form-urlencoded"
        },

        body: "name=" + encodeURIComponent(name)

    })

    .then(response => response.json())

    .then(data => {

        document.getElementById("message").innerText =
            data.message;


        if (data.success) {

            showIDE();

        }

    });

}



function registerWizard() {

    let name =
        document.getElementById("registerName").value;

    let age =
        document.getElementById("registerAge").value;


    fetch("./register", {

        method: "POST",

        headers: {

            "Content-Type":
                "application/x-www-form-urlencoded"

        },

        body:
            "name=" + encodeURIComponent(name) +
            "&age=" + encodeURIComponent(age)

    })

    .then(response => response.json())

    .then(data => {

        document.getElementById("message").innerText =
            data.message;


        if (data.success) {

            showIDE();

        }

    });

}

function showIDE() {

    document.getElementById("loginScreen")
        .style.display = "none";

    document.getElementById("ideScreen")
        .style.display = "block";

    createEditor();
}



function runSpell() {

    let source = getEditorCode();

    fetch("./run", {

        method: "POST",

        headers: {
            "Content-Type": "application/json"
        },

        body: JSON.stringify({
            source: source
        })

    })

    .then(response => response.json())

    .then(data => {

        document.getElementById("output").innerText =
            data.output;

    });
}

</script>
<script src="./editor.js"></script>
</body>
</html>
